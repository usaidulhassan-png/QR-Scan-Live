name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fixed signing key (same on every build so updates install over the old app)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null

      - name: Create Android project and copy app files
        run: |
          flutter create --platforms=android --org com.uhdatatech --project-name uh_qr_scanner app
          MAIN=$(grep -rl --include=main.dart "kAppName" . | grep -v "^./app/" | head -1)
          PUB=$(grep -rl --include=pubspec.yaml "mobile_scanner: ^7" . | grep -v "^./app/" | head -1)
          if [ -z "$PUB" ]; then PUB=$(grep -rl --include=pubspec.yaml "mobile_scanner" . | grep -v "^./app/" | head -1); fi
          echo "Using main.dart: $MAIN"
          echo "Using pubspec.yaml: $PUB"
          if [ -z "$MAIN" ] || [ -z "$PUB" ]; then echo "ERROR: the new main.dart or pubspec.yaml was not found in the repository"; exit 1; fi
          cp "$MAIN" app/lib/main.dart
          cp "$PUB" app/pubspec.yaml
          grep -n "kVersion =" app/lib/main.dart
          rm -f app/test/widget_test.dart
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application android:usesCleartextTraffic="true"|' $M
          sed -i 's|android:label="[^"]*"|android:label="UH QR Scanner"|' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' app/android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' app/android/app/build.gradle || true
          sed -i 's|signingConfig = signingConfigs.getByName("debug")|signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false|' app/android/app/build.gradle.kts || true
          sed -i 's|signingConfig signingConfigs.debug|signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false|' app/android/app/build.gradle || true

      - name: Verify that minify is disabled
        run: |
          cd app/android/app
          grep -n -i "minify\|shrink" build.gradle* || true
          grep -q -E "isMinifyEnabled = false|minifyEnabled false" build.gradle*

      - name: APK build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: UH-Wireless-QR-Scanner-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
