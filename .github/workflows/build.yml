name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android project banao aur app files copy karo
        run: |
          flutter create --platforms=android --org com.uhdatatech --project-name uh_qr_scanner app
          cp "$(find . -path '*app_src/main.dart' | head -1)" app/lib/main.dart
          cp "$(find . -path '*app_src/pubspec.yaml' | head -1)" app/pubspec.yaml
          rm -f app/test/widget_test.dart
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application android:usesCleartextTraffic="true"|' $M
          sed -i 's|android:label="[^"]*"|android:label="UH QR Scanner"|' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' app/android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' app/android/app/build.gradle || true

      - name: APK build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: UH-Wireless-QR-Scanner-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
